[project]
name = "nvpoca"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dbus-fast>=5.2.0",
    "linuxpy>=0.25.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "tensorrt-cu13>=11.3.0.99",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
